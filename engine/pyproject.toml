[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anjeo-engine"
version = "0.1.0"
description = "Anjeo engine: one control plane for every MCP server you own, with an approval gate between your agents and the world."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=2.3,<3",
    "anthropic>=2.6,<3",
    "pydantic>=2.9,<3",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
anjeo = "anjeo.__main__:main"

[tool.setuptools]
packages = ["anjeo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is declared through Depends() defaults.
"anjeo/api.py" = ["B008"]
